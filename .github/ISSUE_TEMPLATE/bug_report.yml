name: Bug report / 问题报告
description: Something doesn't work as it should. / 有地方不对劲。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Have an AI agent such as Claude Code or Codex?** In Tomoru (versions after 0.1.4), go to Settings › About › Feedback & ideas, choose Problem and Copy for an AI agent, then paste it into the agent: it goes through the logs with you, redacts them, and opens the issue once you say yes. Otherwise, fill in the form below.

        **有 Claude Code、Codex 这样的 AI Agent？** 在 Tomoru（0.1.4 之后的版本）的 设置 › 关于 › 反馈与建议 里选「问题」，点「复制给 AI Agent」，粘贴给它：它会和你一起看日志、脱敏，你同意后再提交 issue。没有的话，填写下面的表单即可。
  - type: input
    id: version
    attributes:
      label: Tomoru version / 版本
      description: Settings › About / 设置 › 关于
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version and computer / 系统版本和电脑
      placeholder: "macOS 26.1, MacBook Air M3 / Windows 11 24H2, RTX 4060"
  - type: input
    id: engines
    attributes:
      label: Engines / 引擎
      description: Recognition and translation, and the languages. / 识别、翻译引擎和语言。
      placeholder: "Apple → Index-Translate cloud, ja → zh-Hans"
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: What you did, what you expected, and what happened instead. / 你做了什么、预期是什么、实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Settings › About › Show logs. Look through them first; they may name apps you listened to. / 设置 › 关于 › 显示日志。附上前请先看一遍，里面可能有你收听的应用名。
      render: text
