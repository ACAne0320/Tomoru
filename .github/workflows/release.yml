name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the version, and take its notes from the changelog
        run: |
          version=$(jq -r .version app/mygo.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the version of app/mygo.json, $version."
            exit 1
          fi
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' app/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::app/CHANGELOG.md has no section for $version."
            exit 1
          fi
          releases="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          tarball="tomoru-$version-linux-amd64.tar.gz"
          deb="tomoru_$(printf %s "$version" | tr -- '-+' '..')_amd64.deb"
          case "$GITHUB_REF_NAME" in
          *-*) linux="On any Linux distribution, download [$tarball]($releases/$tarball) and [install.sh]($releases/install.sh), and run \`sh install.sh $tarball\` where they are: it installs this prerelease without root, and that install updates itself to the next release; the Debian package does not." ;;
          *) linux="On any Linux distribution, \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\` installs the latest release without root, and that install updates itself; the Debian package does not." ;;
          esac
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Download

          | | GitHub | Mainland China |
          |---|---|---|
          | macOS (Apple silicon) | [tomoru-$version-arm64.dmg]($releases/tomoru-$version-arm64.dmg) | [tomoru.acane.dev/download/mac](https://tomoru.acane.dev/download/mac?from=cloudflare) |
          | Windows 11 x64 | [tomoru-setup-$version-amd64.exe]($releases/tomoru-setup-$version-amd64.exe) | [tomoru.acane.dev/download/windows](https://tomoru.acane.dev/download/windows?from=cloudflare) |
          | Linux x64 (Debian, Ubuntu) | [$deb]($releases/$deb) | [tomoru.acane.dev/download/linux](https://tomoru.acane.dev/download/linux?from=cloudflare) |

          The mainland China links give the latest release, half an hour at most after it is published.
          $linux
          NOTES
      - name: Create the draft release, or update its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            pre=
            case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre \
              --title "Tomoru ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  macos:
    needs: draft
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            engine/asr/go.sum
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
      - name: Build what the app ships, and check its licenses
        run: |
          scripts/setup.sh darwin-arm64
          scripts/package-licenses.sh --release-check darwin-arm64
      - name: Build and upload
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -upload

  windows:
    needs: [draft, macos]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out files as they are, with LF line ends, for MSYS2's shell and the license check
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            engine/asr/go.sum
            engine/shared/go.sum
            engine/windows/go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc unzip diffutils
      - name: Build what the app ships, and check its licenses
        run: |
          scripts/setup.sh windows-amd64
          scripts/package-licenses.sh --release-check windows-amd64
      - name: Build and upload
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -upload

  linux:
    needs: [draft, windows]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            engine/asr/go.sum
            engine/shared/go.sum
            engine/linux/go.sum
      - name: Install libpulse's and GTK 3's headers and patchelf, for the engine
        run: sudo apt-get update && sudo apt-get install -y libpulse-dev libgtk-3-dev patchelf
      - name: Build what the app ships, and check its licenses
        run: |
          scripts/setup.sh linux-amd64
          scripts/package-licenses.sh --release-check linux-amd64
      - name: Build and upload
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -upload
