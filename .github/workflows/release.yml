name: Release

# Pushing a tag v<version> builds the macOS and Windows apps, signs them and their updates, and
# uploads them to a draft release whose notes are the version's section of app/CHANGELOG.md. The
# draft is published by hand (docs/release.md). Needs the repository secrets MACOS_CERTIFICATE
# (the .p12 of "Tomoru Self-Signed", base64), MACOS_CERTIFICATE_PASSWORD and
# MYGO_UPDATER_PRIVATE_KEY.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the version, and take its notes from the changelog
        run: |
          version=$(jq -r .version app/mygo.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the version of app/mygo.json, $version."
            exit 1
          fi
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' app/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::app/CHANGELOG.md has no section for $version."
            exit 1
          fi
      - name: Create the draft release, or update its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            pre=
            case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre \
              --title "Tomoru ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  macos:
    needs: draft
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            engine/asr/go.sum
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
      - name: Build what the app ships, and check its licenses
        run: |
          scripts/setup.sh darwin-arm64
          scripts/package-licenses.sh --release-check darwin-arm64
      - name: Build and upload
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -upload

  windows:
    # After macOS, whether it passed or not: each upload merges the release's SHA256SUMS with its
    # own, and two at once replace each other's.
    needs: [draft, macos]
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out files as they are, with LF line ends, for MSYS2's shell and the license check
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            engine/asr/go.sum
            engine/windows/go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit # Go and gh, from Windows
          install: mingw-w64-x86_64-gcc unzip diffutils
      - name: Build what the app ships, and check its licenses
        run: |
          scripts/setup.sh windows-amd64
          scripts/package-licenses.sh --release-check windows-amd64
      - name: Build and upload
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -upload
