name: Deploy site

# Publishes site/ to https://tomoru.acane.dev (Cloudflare Workers) when it changes on main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template)
# and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ACAne0320/Tomoru'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.155.0"
